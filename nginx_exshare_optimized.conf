# ==============================================================================
# EX SHARE / Atelier Backend - Production Optimized Nginx Configuration
# High-Throughput Media Streaming, Resumable Uploads & X-Accel-Redirect
# ==============================================================================

upstream exshare_backend {
    # Unix socket (recommended for Linux production servers)
    server unix:/run/gunicorn/exshare.sock fail_timeout=0;
    # Fallback / Alternative TCP socket:
    # server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    server_name api.exshare.example.com; # Replace with your production domain / IP

    # Redirect all HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    # Performance Tuning: Kernel-level I/O optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # File cache descriptor tuning for serving millions of images
    open_file_cache max=50000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Upload Body Limits
    # Max size per request (chunked uploads use 8MB chunks, direct uploads allow up to 500MB)
    client_max_body_size 500M;
    client_body_buffer_size 1M;

    # Gzip settings for JSON/API responses (exclude pre-compressed images/videos)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. High-Speed Upload Endpoints (Disable Request Buffering)
    # Stream bytes directly into Django / Python process without waiting for 
    # Nginx to buffer entire 500MB into temp files on disk first.
    # --------------------------------------------------------------------------
    location ~* ^/api/(storage/uploads/chunk|culling/upload|events/[0-9]+/upload)/ {
        proxy_pass http://exshare_backend;
        proxy_http_version 1.1;

        # CRITICAL: Stream uploads immediately to Django
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Extended timeouts for large parallel file transfers
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # 2. X-Accel-Redirect: Zero-Copy Private Media Delivery
    # When Django responds with 'X-Accel-Redirect: /protected_media/...',
    # Nginx intercepts it and serves the file directly from disk via sendfile.
    # --------------------------------------------------------------------------
    location /protected_media/ {
        # INTERNAL ONLY: Clients cannot request /protected_media/ directly
        internal;

        # Path must match settings.MEDIA_ROOT on local server:
        # e.g., /www/server/exshare/media/ or /home/ubuntu/exshare/media/
        alias /www/server/photography-project-djangorest/media/;

        # Performance optimizations for serving binary assets
        sendfile on;
        sendfile_max_chunk 2M;
        tcp_nopush on;
        tcp_nodelay on;

        # Enable Byte-Range Requests for high-res images and video seeking
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Disposition";

        # Browser caching for immutable media objects
        expires 30d;
        add_header Cache-Control "private, no-transform, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # 3. Public Previews & Thumbnails (Cached & Fast)
    # --------------------------------------------------------------------------
    location /media/storage_objects/galleries/.*/(thumbnails|previews)/ {
        alias /www/server/photography-project-djangorest/media/;
        sendfile on;
        tcp_nopush on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # --------------------------------------------------------------------------
    # 4. Static Files (Admin, CSS, JS)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /www/server/photography-project-djangorest/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 5. Default Application Proxy (Django REST Framework)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://exshare_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
