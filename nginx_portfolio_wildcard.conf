# ==============================================================================
# EX SHARE Atelier — Wildcard Subdomains & Public Portfolio Ingress
# Domain Scope: *.exshare.ai (Wildcard routing for photographer portfolios)
# Integration: aaPanel / Nginx + Gunicorn / Django REST Framework
# ==============================================================================

# Backend upstream definition (matches main site config)
upstream exshare_portfolio_backend {
    server unix:/run/gunicorn/exshare.sock fail_timeout=0;
    # Fallback TCP upstream:
    # server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Redirect for Wildcard Subdomains
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name *.exshare.ai;

    # Redirect all plain HTTP traffic to HTTPS preserving the original host
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 2. HTTPS Wildcard Server Block for Photographer Portfolios
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name *.exshare.ai;

    # SSL Certificate (Must cover *.exshare.ai generated via Let's Encrypt DNS-01)
    ssl_certificate /www/server/panel/vhost/cert/exshare.ai/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/exshare.ai/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root directory pointing to the compiled production React SPA build
    root /www/server/photography-frontend/dist;
    index index.html;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # A. Public Portfolio APIs Proxied to Django (Host Preserved)
    # --------------------------------------------------------------------------
    location ~* ^/api/public/portfolio-site(/.*)?$ {
        proxy_pass http://exshare_portfolio_backend;
        proxy_http_version 1.1;

        # CRITICAL: Preserve original Host (e.g., mridhul.exshare.ai) so Django resolves the tenant!
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # B. Public Media & Thumbnails Delivery (Fast Local Cache)
    # --------------------------------------------------------------------------
    location /media/ {
        alias /www/server/photography-project-djangorest/media/;
        sendfile on;
        tcp_nopush on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # --------------------------------------------------------------------------
    # C. Static Assets of React Build (JS, CSS, Fonts, Icons)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # D. React SPA Fallback: All Other Paths Render index.html
    # Deep links like https://mridhul.exshare.ai/projects/paris-fashion-week
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disallow access to hidden dotfiles (.env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
